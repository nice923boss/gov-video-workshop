<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公務短影音工作台｜從公文到一支公務短影音</title>
<meta name="description" content="公務影音簡易剪輯研習班工作坊：五階段引導填寫，把單位的一則公文或活動企劃成一支公務短影音，逐步檢查企劃五格、每秒字數、拍攝清單、AI 補畫面與多平台輸出，最後下載《公務短影音企劃與製作報告》PDF。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- rough.js 同步載入：診斷視覺化在第一次渲染就要用；其餘函式庫 defer，未載入時各功能自動降級 -->
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/rough-notation@0.5.1/lib/rough-notation.iife.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ======================================================
   設計系統：手繪筆記本版面（色票、字型、裝飾在下方 THEME 區塊）
   ====================================================== */
:root{
  --navy:var(--ink); --teal:var(--blue); --primary:var(--red);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --sh:3px 3px 0 var(--ink); --sh-s:2px 2px 0 var(--ink);
  --r-hand:255px 15px 225px 15px/15px 225px 15px 255px;
  --r-card:16px 5px 14px 6px/6px 14px 5px 16px;
  --topbar-h:62px; --sidebar-w:278px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;background:var(--paper)}
a{color:var(--blue)}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.3;color:var(--ink);font-family:var(--hand);font-weight:700}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px} h4{font-size:15px;color:var(--ink-2)}
p{margin:0 0 .8em}
small{font-size:12.5px}
code,.mono{font-family:var(--type);font-size:.9em;background:var(--paper-3);padding:1px 5px;border-radius:3px}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::placeholder{color:var(--muted-2)}
::selection{background:var(--yellow-soft)}

/* ---------- 頂部列：墨色底（下緣裝飾 .topbar::after 在 THEME） ---------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--topbar-h);background:var(--ink);color:var(--paper-2);display:flex;align-items:center;gap:14px;padding:0 18px}
.topbar .brand{display:flex;align-items:center;gap:11px;font-family:var(--hand);font-weight:700;font-size:18px;letter-spacing:.5px;white-space:nowrap}
.topbar .brand .logo{width:38px;height:38px;border-radius:7px 3px 8px 4px;background:var(--paper-2);color:var(--ink);display:grid;place-items:center;font-size:21px;font-weight:700;transform:rotate(-4deg);box-shadow:2px 2px 0 var(--red)}
.topbar .brand .sub{font-family:var(--font);font-weight:400;font-size:11.5px;opacity:.7;display:block;line-height:1.2;letter-spacing:0}
.topbar .spacer{flex:1}
.topbar .progress{display:flex;align-items:center;gap:10px;font-family:var(--type);font-size:12.5px;min-width:190px}
.topbar .progress .bar{flex:1;height:10px;border:1.5px solid var(--paper-2);border-radius:2px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(var(--paper-rgb),.25) 9px 10px)}
.topbar .progress .bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .5s}
.topbar .btn{background:transparent;color:var(--paper-2);border:1.5px solid rgba(var(--paper-rgb),.55);box-shadow:none}
.topbar .btn:hover{background:rgba(var(--paper-rgb),.12);color:#fff;transform:none;box-shadow:none}
.topbar .menu-btn{display:none}

/* ---------- 版面：深色側欄（底紋在 THEME） ---------- */
.app{display:flex;min-height:calc(100vh - var(--topbar-h))}
.sidebar{width:var(--sidebar-w);flex:0 0 auto;padding:22px 26px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow:auto;color:var(--paper-2);background-color:var(--dark)}
.sidebar .sb-title{font-family:var(--type);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--on-dark-muted);margin:6px 4px 10px}
.sidebar .muted{color:var(--on-dark-muted)}
.main{flex:1;min-width:0;padding:32px 34px 40px}
.container{max-width:1180px;margin:0 auto}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;margin-bottom:6px;border-radius:3px;cursor:pointer;border:1.5px solid var(--dark-line);background:var(--dark-2);transition:.15s;position:relative}
.step:hover{background:var(--dark-3)}
.step.active{background:var(--paper-2);border-color:var(--paper-2)}
.step.active .lbl{color:var(--ink)} .step.active .en{color:var(--muted)}
.step.locked{opacity:.45;cursor:not-allowed}
.step .num{width:28px;height:28px;border-radius:3px;display:grid;place-items:center;font-family:var(--type);font-size:13px;flex:0 0 auto;background:var(--dark-line);color:var(--paper-2)}
.step.done .num{background:var(--green);color:#fff}
.step.current .num{background:var(--yellow);color:var(--ink)}
.step .lbl{font-family:var(--hand);font-size:15px;font-weight:700;color:var(--paper-2);line-height:1.3}
.step .en{font-family:var(--type);font-size:10.5px;color:var(--on-dark-dim);display:block;margin-top:2px}
.step .st{font-size:10.5px;margin-top:4px;display:inline-block;padding:0 7px;border-radius:2px;background:var(--dark-line);color:var(--on-dark)}
.step.done .st{background:var(--green);color:#fff}
.step.current .st{background:var(--yellow);color:var(--ink)}
.step.active .st{outline:1px solid var(--ink-2)}
.sb-home{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:3px;cursor:pointer;font-family:var(--hand);font-weight:700;font-size:15px;color:var(--paper-2);border:1.5px dashed var(--dark-dash)}
.sb-home:hover{background:var(--dark-3)}
.sb-home.active{background:var(--paper-2);color:var(--ink);border-style:solid}
.sb-sep{height:0;border-top:1.5px dashed var(--dark-line);margin:12px 2px}
.sidebar .btn{background:var(--dark-2);color:var(--paper-2);border-color:var(--dark-dash);box-shadow:none}
.sidebar .btn:hover{background:var(--dark-3);transform:none;box-shadow:none}
.sidebar .btn.danger{color:var(--on-dark-danger)}

/* ---------- 卡片與元件 ---------- */
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-card);box-shadow:4px 4px 0 var(--ink);padding:22px 24px;margin-bottom:22px}
.card.tight{padding:14px 18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 17px;border-radius:var(--r-hand);border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;line-height:1.2;white-space:nowrap;box-shadow:var(--sh-s)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.teal{background:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.btn.ghost{background:transparent;border-style:dashed;box-shadow:none}
.btn.ghost:hover{box-shadow:none;background:rgba(var(--ink-rgb),.05)}
.btn.sm{padding:5px 11px;font-size:12.5px;box-shadow:1.5px 1.5px 0 var(--ink)}
.btn.lg{padding:12px 24px;font-size:16px;font-family:var(--hand)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:3px;font-size:11.5px;font-weight:700;letter-spacing:.3px;line-height:1.7;white-space:nowrap;border:1.5px solid currentColor}
.badge.ex{background:var(--paper-3);color:var(--muted)}
.badge.in{background:var(--blue-soft);color:var(--blue)}
.badge.dx{background:var(--green-soft);color:var(--green)}
.badge.hy{background:var(--yellow-soft);color:var(--yellow-ink)}
.badge.g{background:var(--green-soft);color:var(--green)} .badge.y{background:var(--yellow-soft);color:var(--yellow-ink)} .badge.r{background:var(--red-soft);color:var(--red)}
.badge.navy{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.pill{display:inline-block;padding:2px 11px;border-radius:var(--r-hand);background:var(--paper-2);border:1.5px solid var(--ink-2);font-size:12.5px;color:var(--ink-2)}
.kpi{background:var(--paper-2);border:2px dashed var(--ink-2);border-radius:6px;padding:13px 15px;position:relative}
.kpi .v{font-family:var(--hand);font-size:28px;font-weight:700;color:var(--ink);line-height:1.15}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.g{border-left:7px solid var(--green)} .kpi.y{border-left:7px solid var(--yellow)} .kpi.r{border-left:7px solid var(--red)} .kpi.b{border-left:7px solid var(--blue)}
.light{display:inline-block;width:15px;height:15px;border-radius:50%;vertical-align:middle;border:2px solid var(--ink)}
.light.g{background:var(--green)} .light.y{background:var(--yellow)} .light.r{background:var(--red)} .light.n{background:var(--paper-3)}
.note{background:var(--blue-soft);border:1.5px solid var(--ink-2);border-left:6px solid var(--blue);padding:10px 14px;border-radius:2px 8px 8px 2px;font-size:13.5px;margin:10px 0;box-shadow:2px 3px 0 rgba(var(--ink-rgb),.12)}
.note.warn{border-left-color:var(--yellow);background:var(--yellow-soft)}
.note.ok{border-left-color:var(--green);background:var(--green-soft)}
.note.err{border-left-color:var(--red);background:var(--red-soft)}
.note.gray{border-left-color:var(--muted-2);background:var(--paper-2)}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.right{text-align:right} .center{text-align:center}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb0{margin-bottom:0}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sb{justify-content:space-between}
hr.sep{border:0;border-top:1.5px dashed var(--line-2);margin:16px 0}
ul.clean{padding-left:18px;margin:4px 0}
ul.clean li{margin:3px 0}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{position:relative;padding:9px 0 9px 44px;border-bottom:1.5px dashed var(--line);counter-increment:s}
ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:9px;width:32px;height:26px;border:2px solid var(--ink);border-radius:3px;background:var(--yellow-soft);color:var(--ink);font-family:var(--type);font-size:12px;display:grid;place-items:center}
ol.steps li:last-child{border-bottom:0}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border:1px solid var(--line-2);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--paper-3);font-family:var(--hand);font-weight:700;color:var(--ink);font-size:13.5px;white-space:nowrap}
.tbl tr:nth-child(even) td{background:rgba(var(--paper3-rgb),.3)}
.tbl.compact th,.tbl.compact td{padding:5px 8px;font-size:12.5px}
.tbl td.mono{white-space:nowrap}
body{text-wrap:balance}
.tbl-wrap{overflow:auto;border-radius:4px;border:2px solid var(--ink)}
.tbl-wrap .tbl{border:0}
.tbl-wrap .tbl th:first-child,.tbl-wrap .tbl td:first-child{border-left:0}
.tbl-wrap .tbl th:last-child,.tbl-wrap .tbl td:last-child{border-right:0}
.tbl-wrap .tbl tr:first-child th{border-top:0}
.tbl-wrap .tbl tr:last-child td{border-bottom:0}

/* 表單：橫線紙上填寫 */
.field{margin-bottom:18px}
.field label.lbl{display:flex;align-items:center;gap:6px;font-family:var(--hand);font-weight:700;font-size:15.5px;color:var(--ink);margin-bottom:5px;flex-wrap:wrap}
.field .req{color:var(--red);font-weight:800}
.field .help{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field .ex{font-size:12px;color:var(--muted-2);padding:4px 2px 0;line-height:1.55}
.field .ex b{color:var(--muted);font-weight:700;font-family:var(--type);font-size:11px;letter-spacing:.5px;margin-right:2px}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;padding:9px 11px;border:2px solid var(--ink-2);border-radius:7px 3px 6px 4px;background:var(--field-bg);outline:none;transition:.15s}
.field textarea{min-height:92px;resize:vertical;line-height:28px;padding-top:6px;background:var(--field-bg) linear-gradient(transparent 27px,var(--line) 27px) 0 6px/100% 28px local}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);box-shadow:3px 3px 0 var(--yellow)}
.field.invalid input,.field.invalid select,.field.invalid textarea,.field.invalid .tbl-wrap{border-color:var(--red);box-shadow:3px 3px 0 var(--red-soft)}
.field .err-msg{display:none;color:var(--red);font-size:12.5px;margin-top:4px;font-weight:700}
.field.invalid .err-msg{display:block}
.chk-group{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1.5px solid var(--ink-2);border-radius:var(--r-hand);background:var(--field-bg);cursor:pointer;font-size:13px;user-select:none}
.chk input{margin:0;accent-color:var(--red)}
.chk.on{background:var(--yellow-soft);border:2px solid var(--ink);font-weight:700;box-shadow:var(--sh-s)}
.likert{display:flex;gap:4px;flex-wrap:wrap}
.likert label{flex:1;min-width:46px;text-align:center;border:1.5px solid var(--ink-2);border-radius:4px;padding:6px 4px;cursor:pointer;font-size:12.5px;background:var(--field-bg)}
.likert label.on{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.likert input{display:none}
.tbl-edit input,.tbl-edit select,.tbl-edit textarea{width:100%;min-width:90px;padding:6px 8px;border:1.5px solid var(--line-2);border-radius:4px;background:var(--field-bg);font-size:13px}
.tbl-edit textarea{min-height:40px;resize:vertical}
.tbl-edit td{padding:5px 6px;vertical-align:middle}
.tbl-edit td.calc{font-weight:700;text-align:center;background:var(--paper-3);white-space:nowrap;font-family:var(--type)}
.tbl-edit .rm{border:0;background:transparent;color:var(--muted-2);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}
.tbl-edit .rm:hover{color:var(--red);background:var(--red-soft)}
.form-section{border:1.5px solid var(--ink-2);border-radius:6px 3px 7px 4px;padding:16px 18px;margin-bottom:18px;background:var(--paper-2)}
.form-section>h3{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px dashed var(--line-2);flex-wrap:wrap}
.form-section>h3 .n{width:28px;height:28px;border-radius:3px;background:var(--ink);color:var(--paper-2);font-family:var(--type);font-size:13px;display:grid;place-items:center}

/* 分頁：筆記本索引標籤 */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:22px;overflow-x:auto;padding:4px 4px 0}
.tab{padding:8px 15px;font-family:var(--hand);font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;border:2px solid var(--ink-2);border-bottom:0;border-radius:9px 9px 0 0;background:var(--paper-3);white-space:nowrap;display:flex;align-items:center;gap:6px;position:relative;top:2px}
.tab:hover{color:var(--ink);background:var(--paper-2)}
.tab.active{color:var(--red);background:var(--card);border-color:var(--ink);border-bottom:2px solid var(--card);z-index:1}
.tab .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted-2)}
.tab.has .dot{background:var(--green);border-color:var(--green)}
.tabpanel{display:none}.tabpanel.active{display:block}

/* 階段標頭（.big::before 裝飾在 THEME） */
.stage-hero{display:flex;gap:22px;align-items:flex-start;background:var(--card);border:2px solid var(--ink);border-radius:var(--r-card);padding:24px 24px 20px;margin-bottom:20px;box-shadow:4px 4px 0 var(--ink);position:relative}
.stage-hero .big{width:66px;height:58px;margin-top:14px;border-radius:2px 2px 6px 6px;background:var(--ink);color:var(--paper-2);font-family:var(--type);font-size:28px;display:grid;place-items:center;flex:0 0 auto;position:relative}
.stage-hero h1{font-size:27px;margin-bottom:0}
.stage-hero .en{font-family:var(--type);color:var(--muted);font-size:12.5px;margin-bottom:8px;letter-spacing:.5px}
.stage-hero .goal{font-size:14px;color:var(--ink-2)}

/* 首頁主視覺（.slate-clap 頂條裝飾在 THEME） */
.slate{border:2px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);margin-bottom:24px;overflow:hidden;background:var(--ink);color:var(--paper-2)}
.slate-body{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;padding:26px 28px 28px;align-items:center}
.slate .eyebrow{font-family:var(--type);font-size:12.5px;letter-spacing:2.5px;color:var(--yellow)}
.slate h1{color:var(--paper-2);font-size:36px;margin:6px 0 10px}
.slate .lead{color:var(--on-dark-2);font-size:15px;max-width:640px}
.slate-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid rgba(var(--paper-rgb),.5);margin:14px 0 18px}
.slate-grid div{padding:7px 10px;border-right:1.5px solid rgba(var(--paper-rgb),.5)}
.slate-grid div:last-child{border-right:0}
.slate-grid b{display:block;font-family:var(--type);font-weight:400;font-size:10.5px;letter-spacing:1.5px;color:var(--on-dark-muted)}
.slate-grid span{font-family:var(--hand);font-size:19px;font-weight:700}
.slate .btn{box-shadow:2px 2px 0 var(--paper-2);border-color:var(--paper-2)}
.slate .btn:hover{box-shadow:3px 3px 0 var(--paper-2)}
.slate .btn.ghost{color:var(--paper-2)}
.slate-art{margin:0;background:var(--paper-2);border-radius:4px;padding:10px;transform:rotate(1.5deg);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.slate-art img,.slate-art svg{display:block;width:100%;height:auto;border-radius:2px}
.slate-art figcaption{font-family:var(--hand);color:var(--ink-2);font-size:13px;text-align:center;margin-top:6px}
.hero{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-card);padding:28px 30px;margin-bottom:22px;box-shadow:4px 4px 0 var(--ink)}
.hero .eyebrow{font-family:var(--type);font-size:12px;letter-spacing:2px;color:var(--red)}
.hero h1{font-size:32px;margin:6px 0 8px}
.hero .lead{font-size:15.5px;color:var(--muted);max-width:760px}
.reel{background-color:var(--ink);border-radius:4px;padding:20px 10px;overflow-x:auto}
.reel .stage-tiles{display:grid;grid-template-columns:repeat(var(--n,9),minmax(104px,1fr));gap:6px}
.stage-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:2px solid transparent;border-radius:3px;padding:10px 9px 9px;background:var(--paper-2);cursor:pointer;transition:transform .15s;position:relative;display:flex;flex-direction:column;gap:3px;min-height:128px}
.tile:hover{transform:translateY(-3px)}
.tile.now{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(var(--yellow-rgb),.35)}
.tile.locked{opacity:.55}
.tile .n{font-family:var(--type);font-size:11px;color:var(--muted);letter-spacing:1px}

/* =====================================================================
   PART A-2：診斷規則（RULES）、擴充分頁（EXTRA_TABS）、成果報告（REPORT）
   主題：公務影音簡易剪輯研習班，從公文到一支公務短影音（五階段）。
   規則出處：D1／D2 簡報、提示詞 D1-P1～D2-P9、sketches2（wpm、safezone、ratios、ducking）、成果實作 8 項。
   規則撰寫慣例：
   - RULES[n]=(d,S)=>({...})：d 是本階段剛確認的資料；S.d(id) 取前階段已確認資料（未確認為 null）
   - 每條結論用 R('Rn-xx',嚴重度,文字,驗證方式)；嚴重度 h 高／m 中／l 正向／i 提醒（不扣分）
   - 扣分寫在觸發處（score-=N），填寫者能追溯「為什麼是這個分數」
   - 本檔只在函式內使用 PART B 的 helper（R、num、esc、cut、tok…），不可在載入時直接呼叫
   ===================================================================== */
const filled=(rows,k)=>(rows||[]).filter(r=>String(r[k]==null?'':r[k]).trim());
const hasNum=s=>/\d/.test(String(s||''));
const sumOf=(rows,k)=>(rows||[]).reduce((a,r)=>a+num(r[k]),0);
const lead=s=>String(s||'').split(/[（(]/)[0].trim();          // 取括號前的主句，避免截斷後括號不成對
const unquote=s=>String(s||'').trim().replace(/^[「"]+|[」"]+$/g,''); // 去掉填寫者已加的引號，避免「「」」
const plain=s=>String(s||'').replace(/[「」『』"]/g,'');
const lines=s=>String(s||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
const RULES={};

/* ---------------- 課程規格（公務影音簡易剪輯研習班 D1／D2） ---------------- */
/* Shot rows that have any content; shot number = index + 1 (shared by carry and rules) */
const shotRows=d=>(d&&d.shots||[]).filter(r=>['scene','pic','voice'].some(k=>String(r[k]||'').trim()));
const nosTxt=ns=>`第 ${ns.join('、')} 鏡`;
const shotNos=s=>(String(s||'').match(/\d+/g)||[]).map(Number);
const numsIn=s=>(String(s||'').match(/\d+(?:[.,]\d+)*/g)||[]).map(x=>x.replace(/,/g,''));
const normTxt=s=>plain(s).replace(/[\s，。、！？：；,.!?:;…～]/g,'');
const BROAD=/所有人|全體|全民|大家|每個人|任何人|一般民眾|社會大眾/;
const ACT_VERB=/撥打|預約|報名|上網|下載|分享|申請|加入|登記|掃描|搜尋|前往|查證|填寫|點選|追蹤|來電|參加|轉傳|告訴|記得|回報|檢查/;
const HYPE=/保證|絕對|百分之百|100%|最強|第一|唯一|完全/;
const NO_TEXT=/不要(出現)?(任何)?文字|no text/i;
const TEXT_IN_PIC=/字|標語|寫有|寫著|招牌|告示|警告牌|標示牌/;
const ratioOrient=r=>r==='9:16'?'直拍':r==='16:9'?'橫拍':'';
/* sketches2 safezone：各比例的平台按鈕與說明文字區（百分比 x,y,w,h），以及字卡位置 */
const SAFE_ZONES={'9:16':[[0,0,100,8],[82,42,18,58],[0,80,100,20]],'16:9':[[0,85,100,15]],'1:1':[[0,84,100,16]]};
const SAFE_TIP={'9:16':'Shorts、Reels 右側有按讚分享鈕，下方有說明文字，字卡放中間偏上。','16:9':'YouTube 下方是播放控制列，字卡別貼底。','1:1':'Facebook 動態牆常靜音播放，字卡要大、要早出現，也不要貼底。'};
const CARD_RECT={'中間偏上':[18,28,64,8],'畫面中間':[18,46,64,8],'貼近底部':[18,86,64,8],'靠右側':[62,60,34,8]};
const hitZone=(ratio,pos)=>{const c=CARD_RECT[pos];if(!c)return false;
  return(SAFE_ZONES[ratio]||[]).some(z=>c[0]<z[0]+z[2]&&z[0]<c[0]+c[2]&&c[1]<z[1]+z[3]&&z[1]<c[1]+c[3]);};

/* ---------------- 手繪風 SVG（rough.js；未載入或出錯時退回一般圖形） ---------------- */
let _skg=null;
const skGen=()=>{if(_skg)return _skg;if(typeof rough==='undefined')return null;try{_skg=rough.generator();}catch(e){console.warn('rough.js 初始化失敗，改用一般圖形',e);return null;}return _skg;};
const skPaths=dr=>(_skg.toPaths(dr)||[]).map(p=>`<path d="${p.d}" stroke="${p.stroke}" stroke-width="${p.strokeWidth}" fill="${p.fill||'none'}" vector-effect="non-scaling-stroke"/>`).join('');
const skDraw=(make,fallback)=>{const g=skGen();if(!g)return fallback;try{return skPaths(make(g));}catch(e){console.warn('rough.js 繪製失敗',e);return fallback;}};
const skOpt=(o,base)=>{const opt={...base};['fill','fillStyle','hachureGap','hachureAngle'].forEach(k=>{if(o[k]!=null)opt[k]=o[k];});return opt;};
const skRect=(x,y,w,h,o)=>{o=o||{};const st=o.stroke||tok('--ink','#2b2622'),sw=o.strokeWidth||1.4;
  return skDraw(g=>g.rectangle(x,y,w,h,skOpt(o,{roughness:o.roughness!=null?o.roughness:1.4,stroke:st,strokeWidth:sw,seed:o.seed||7})),
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.fill||'none'}" stroke="${st}" stroke-width="${sw}" ${o.fill?'fill-opacity=".55"':''} vector-effect="non-scaling-stroke"/>`);};
const skLine=(x1,y1,x2,y2,o)=>{o=o||{};const st=o.stroke||tok('--ink','#2b2622'),sw=o.strokeWidth||1.4;
  return skDraw(g=>g.line(x1,y1,x2,y2,{roughness:o.roughness!=null?o.roughness:1.2,stroke:st,strokeWidth:sw,seed:o.seed||7}),
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${st}" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>`);};
const skBox=(inner,o)=>{o=o||{};return`<div class="skbox ${o.cls||''}"><svg class="skbox-bg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${skRect(2,2,96,96,{stroke:o.stroke||tok('--ink','#2b2622'),seed:o.seed||7,roughness:1.1})}</svg><div class="skbox-in">${inner}</div></div>`;};
const SK_COL={r:['--red','#c8553d'],y:['--yellow','#d9a23a'],g:['--green','#4f7d5c'],'':['--blue','#2f5d73'],b:['--blue','#2f5d73']};
const skCol=k=>{const c=SK_COL[k||'']||SK_COL[''];return tok(c[0],c[1]);};
const skX=(v,max)=>Math.max(0,Math.min(300,max?v/max*300:0));
/* rows=[{label,value,text?,cls?,band?:[lo,hi]}]；o={max?,cap?,capLabel?}：band 畫建議範圍，cap 畫紅線 */
const skBars=(rows,o)=>{o=o||{};const max=o.max||Math.max(1,...rows.map(r=>num(r.value)));const cap=o.cap!=null?skX(o.cap,max):null;
  return`<div class="skbars">${rows.map((r,i)=>{const w=skX(num(r.value),max),col=skCol(r.cls);
    const band=r.band?skRect(skX(r.band[0],max),1,Math.max(1,skX(r.band[1],max)-skX(r.band[0],max)),16,{stroke:'none',fill:tok('--green-soft','#e3ede2'),fillStyle:'solid',roughness:0.6,seed:30+i}):'';
    const bar=w>0?skRect(0,3,w,12,{stroke:col,fill:col,fillStyle:'hachure',hachureGap:3.5,hachureAngle:-41,roughness:1.2,seed:11+i}):'';
    const capL=cap!=null?skLine(cap,0,cap,18,{stroke:tok('--red','#c8553d'),strokeWidth:2,roughness:0.8,seed:50+i}):'';
    return`<div class="skbar-row"><span title="${esc(r.label)}">${esc(cut(r.label,14))}</span><svg viewBox="0 0 300 18" preserveAspectRatio="none" aria-hidden="true">${band}${bar}${capL}</svg><b>${esc(r.text!=null?r.text:r.value)}</b></div>`;}).join('')}${o.capLabel?`<div class="skbar-cap">${esc(o.capLabel)}</div>`:''}</div>`;};

/* ---------------- 共用計算（只在函式內呼叫） ---------------- */
/* 每鏡旁白速度：字數上限 = 秒數 × 4（D1-P3、D2-P8、sketches2 wpm） */
const speedRows=d=>shotRows(d).map((r,i)=>{const sec=num(r.sec),n=charsOf(r.voice);return{r,no:i+1,sec,n,cap:sec*WPS,over:sec>0&&n>sec*WPS};});
const overNos=d=>d?speedRows(d).filter(o=>o.over).map(o=>o.no):[];
/* 數字出處：先去掉「幾秒」，避免片長被當成原稿外的數字 */
const noSec=s=>String(s||'').replace(/\d+(?:\.\d+)?\s*秒/g,'');
const knownNums=d1=>[...numsIn(d1.sourceText),...numsIn(d1.pending)];
const newNumsIn=(texts,known)=>[...new Set(texts.flatMap(t=>numsIn(noSec(t))))].filter(x=>!known.includes(x));
const ptLines=s=>lines(s).map(x=>x.replace(/^\d+\s*[.、)）]\s*/,''));
const pillTxt=t=>`<span class="pill">${esc(t)}</span>`;
const pillRed=t=>`<span class="pill" style="border-color:var(--red);color:var(--red)">${esc(t)}</span>`;
const tickBox=(st,i)=>`<svg viewBox="0 0 20 20" aria-hidden="true">${skRect(2,2,16,16,{seed:60+i,roughness:1})}${st==='on'?skLine(5,10,9,15,{stroke:tok('--green','#4f7d5c'),strokeWidth:2.2,seed:70+i})+skLine(9,15,16,4,{stroke:tok('--green','#4f7d5c'),strokeWidth:2.2,seed:80+i}):st==='warn'?skLine(10,4,10,12,{stroke:tok('--yellow','#d9a23a'),strokeWidth:2.4,seed:70+i})+skLine(10,14.5,10,16,{stroke:tok('--yellow','#d9a23a'),strokeWidth:2.4,seed:80+i}):''}</svg>`;
const ckRow=(st,i,text,note)=>`<div class="ck ${st}">${tickBox(st,i)}<span>${esc(text)}</span>${note?`<em>${esc(note)}</em>`:''}</div>`;
const triCell=(k,v,warn,seed)=>skBox(`<div class="triad-k">${k}</div><div class="triad-v">${esc(cut(v,40))||'－'}</div>${warn?`<div class="triad-w">${warn}</div>`:''}`,{seed,stroke:warn?tok('--red','#c8553d'):tok('--ink','#2b2622')});

/* ---------------------------------------------------------------- 1 企劃五格 */
RULES[1]=(d)=>{const A=[],H=[],C=[],N=[],M=[];let score=100;
  const pts=ptLines(d.points),vis=lines(d.visuals),len=num(d.length),sp=PLAT_SPEC[d.platform];
  const broad=BROAD.test(d.audience||''),many=pts.length>3,lessVis=vis.length<pts.length,verb=ACT_VERB.test(d.cta||'');
  const newNums=newNumsIn([d.purpose,d.points,d.cta],knownNums(d));
  if(many){A.push(R('R1-01','h',`重點寫了 ${pts.length} 點，超過三點；${len?len+' 秒的片':'一支短片'}講太多事，觀眾一件都記不住。`));C.push(R('R1-01','m',`只留和行動呼籲「${cut(unquote(d.cta),16)}」最相關的三點，其他留給下一支片：${pts.slice(3).map(p=>cut(p,12)).join('、')}。`));score-=12;}
  else A.push(R('R1-01','l',`重點 ${pts.length} 點，沒有超過三點，一支短片講得完。`));
  if(lessVis){A.push(R('R1-02','m',`重點 ${pts.length} 點、畫面 ${vis.length} 個，第 ${vis.length+1} 點起沒有對應的畫面，寫腳本時會缺鏡頭。`));C.push(R('R1-02','m','每個重點配一個畫面，一行一個；想不出畫面的重點，通常也拍不出來，可以考慮刪掉。'));score-=6;}
  else A.push(R('R1-02','l','每個重點都有對應的畫面，第 2 階段可以一個重點寫成一鏡。'));
  if(broad){A.push(R('R1-03','h',`對象寫成「${cut(plain(d.audience),20)}」：想講給所有人聽，等於沒有對象，畫面和用詞都抓不到重點。`));C.push(R('R1-03','m','對象只選最想說服的那一群人，例：65 歲以上長輩與家人、愛玩水的國高中生。'));score-=12;}
  else A.push(R('R1-03','l','對象只選一群人，畫面、用詞與平台都能對準他們。'));
  if(!verb){A.push(R('R1-04','m',`行動呼籲「${cut(unquote(d.cta),20)}」不是一個動作，觀眾看完不知道要做什麼。`));C.push(R('R1-04','m','寫成一個動作，例：撥打 165 查證、上網預約、報名、分享。'));score-=8;}
  else A.push(R('R1-04','l',`行動呼籲「${cut(unquote(d.cta),20)}」是具體動作。`));
  if(len<30||len>90){A.push(R('R1-05','m',`片長 ${len} 秒，不在本課程成品的 30 至 90 秒之間。`));C.push(R('R1-05','m','片長改成 30 至 90 秒；內容放不下，就把重點刪到三點以內。'));score-=8;}
  else A.push(R('R1-05','l',`片長 ${len} 秒，在本課程成品的 30 至 90 秒之間。`));
  let specBad=false;
  if(sp){
    if(d.ratio&&d.ratio!==sp.ratio){A.push(R('R1-06','m',`${d.platform} 常用 ${sp.ratio}，主版本選了 ${d.ratio}，上架後畫面會被裁切或留黑邊。`));C.push(R('R1-06','m',`主版本改成 ${sp.ratio}，其他比例到第 5 階段再改版。`));score-=6;specBad=true;}
    if(sp.max&&(len<sp.min||len>sp.max)){A.push(R('R1-06','m',`${d.platform} 建議 ${sp.min} 至 ${sp.max} 秒，你規劃 ${len} 秒。`));score-=4;specBad=true;}
    if(!sp.max)A.push(R('R1-06','i',`${d.platform}沒有規定片長；${sp.note}。`));
    else if(!specBad)A.push(R('R1-06','l',`${d.platform}、${d.ratio||sp.ratio}、${len} 秒，和平台規格一致。`));
  }
  if(newNums.length){A.push(R('R1-07','h',`目的、重點或行動呼籲裡的數字 ${newNums.join('、')}，原稿重點沒有出現，也沒有寫進待確認事項。`));C.push(R('R1-07','m',`把 ${newNums.join('、')} 寫進「待確認事項」，問清楚出處再放進影片；原稿沒寫的數字不自己補。`));score-=10;}
  else A.push(R('R1-07','l','企劃五格裡的數字，都能在原稿重點或待確認事項找到出處。'));
  H.push(R('R1-08','m',`你的對象常在 ${d.platform||'你選的平台'} 看到機關影片，也願意看完 ${len||'整支'} 秒。`,'發布前問 3 位符合對象條件的人：平常在哪裡看到機關的影片、這個長度會不會看完。'));
  const fix=broad||many||newNums.length>0;
  N.push(R('R1-N1',fix?'h':'m',fix?'先把對象縮成一群人、重點刪到三點、原稿外的數字標成待確認，再用 D1-P2 讓 AI 一題一題問你，問完才寫腳本。':'用 D1-P2 讓 AI 一題一題問你，把五格的答案補完整，再進第 2 階段寫腳本。'));
  N.push(R('R1-N2','m','把原稿和企劃五格存在同一個資料夾，之後每個階段都拿五格對照。'));
  M.push({label:'重點數',value:pts.length+' 點',cls:many?'r':'g'},{label:'畫面數',value:vis.length+' 個',cls:lessVis?'y':'g'},{label:'片長',value:len+' 秒',cls:len<30||len>90?'y':'g'},{label:'原稿外數字',value:newNums.length+' 個',cls:newNums.length?'r':'g'});
  const visual=`<h4>企劃五格與規格</h4><div class="triad">${triCell('目的',d.purpose,'',3)}${triCell('對象',d.audience,broad?'對象太廣':'',5)}${triCell('重點',pts.join('、'),many?'超過三點':'',7)}${triCell('畫面',vis.join('、'),lessVis?'少於重點數':'',9)}${triCell('行動呼籲',d.cta,verb?'':'不是一個動作',11)}${triCell('規格',`${len} 秒｜${d.platform||'－'}｜${d.ratio||'－'}`,specBad?'比例或片長不符平台':'',13)}</div>
  <h4 class="mt12">原稿外的數字</h4><div class="btn-row">${newNums.map(pillRed).join('')||'<span class="tiny muted">沒有</span>'}</div><p class="tiny muted mt8">紅框是要先修的格子；原稿沒寫的數字，先寫進待確認事項。</p>`;
  return{score:Math.max(0,Math.min(100,score)),scoreLabel:'企劃聚焦度',metrics:M,assessment:A,hypotheses:H,recommendations:C,nextActions:N,visual};};

/* ---------------------------------------------------------------- 2 分鏡腳本 */
RULES[2]=(d,S)=>{const A=[],H=[],C=[],N=[],M=[];let score=100;const d1=S.d(1),p1=d1||{};
  const rows=speedRows(d),total=rows.reduce((a,o)=>a+o.sec,0),len=num(p1.length)||total,tol=Math.max(3,Math.round(len*0.1)),diff=total-len;
  const over=rows.filter(o=>o.over),noS=rows.filter(o=>!o.sec);
  const longSent=rows.filter(o=>String(o.r.voice||'').split(/[。！？!?]/).some(x=>charsOf(x)>20));
  const longShot=rows.filter(o=>o.sec>8);
  const first=rows[0],last=rows[rows.length-1],unitL=lead(p1.unit);
  const OPEN_BAD=/局長|致詞|Logo|logo|標誌|機關名稱|大家好|歡迎/;
  const firstTxt=first?[first.r.pic,first.r.voice,first.r.card].join(' '):'';
  const openBad=!!first&&(OPEN_BAD.test(firstTxt)||(!!unitL&&firstTxt.includes(unitL)));
  const ctaN=normTxt(p1.cta),lastTxt=last?normTxt([last.r.voice,last.r.card].join('')):'';
  const endOk=!!last&&((!!ctaN&&lastTxt.includes(ctaN))||ACT_VERB.test(lastTxt));
  const dupCard=rows.filter(o=>{const c=normTxt(o.r.card);return c.length>=6&&normTxt(o.r.voice).includes(c);});
  const newNums=d1?newNumsIn(rows.flatMap(o=>[o.r.voice,o.r.card]),knownNums(d1)):[];
  const aiRows=rows.filter(o=>o.r.way==='AI 生成'),picText=aiRows.filter(o=>TEXT_IN_PIC.test(o.r.pic||''));
  if(!d1)A.push(R('R2-01','i',`鏡頭秒數加起來 ${total} 秒；第 1 階段確認後，會再拿片長比對總秒數。`));
  else if(Math.abs(diff)>tol){A.push(R('R2-01','h',`鏡頭秒數加起來 ${total} 秒，和第 1 階段的片長 ${len} 秒差了 ${Math.abs(diff)} 秒。`));C.push(R('R2-01','m',diff>0?`刪掉或合併鏡頭，把總秒數壓回 ${len} 秒左右。`:`補一鏡開頭或 B-roll，或把第 1 階段的片長改成 ${total} 秒。`));score-=12;}
  else if(diff===0)A.push(R('R2-01','l',`鏡頭秒數加起來 ${total} 秒，剛好等於片長。`));
  else A.push(R('R2-01','i',`鏡頭秒數加起來 ${total} 秒，和片長 ${len} 秒差 ${Math.abs(diff)} 秒，在容許範圍內；剪輯時再對齊。`));
  if(noS.length){A.push(R('R2-01','m',`${nosTxt(noS.map(o=>o.no))}沒有填秒數，算不出總長與每秒字數。`));score-=4;}
  if(over.length){A.push(R('R2-02','h',`${nosTxt(over.map(o=>o.no))}旁白念不完：${over.map(o=>`第 ${o.no} 鏡 ${o.n} 字／上限 ${o.cap} 字`).join('；')}（每秒 4 字）。`));C.push(R('R2-02','m','念不完就刪字，不加快：旁白只留關鍵句，或把這一鏡的秒數拉長。'));score-=Math.min(24,over.length*8);}
  else A.push(R('R2-02','l','每一鏡的旁白都在每秒 4 字以內，念得完。'));
  if(longSent.length){A.push(R('R2-03','m',`${nosTxt(longSent.map(o=>o.no))}有超過 20 字的長句，像把公文直接念出來。`));C.push(R('R2-03','m','一句話只講一件事，長句拆成兩句，或拆成兩鏡。'));score-=6;}
  else A.push(R('R2-03','l','每句旁白都在 20 字以內，念起來不吃力。'));
  if(longShot.length){A.push(R('R2-04','m',`${nosTxt(longShot.map(o=>o.no))}超過 8 秒，一鏡太長，常是塞了兩件事。`));C.push(R('R2-04','m','一個鏡頭只講一件事；超過 8 秒的鏡頭拆成兩鏡。'));score-=4;}
  if(openBad){A.push(R('R2-05','h','第 1 鏡放了機關名稱、長官致詞或問候語，開頭 3 秒抓不住對象，觀眾會直接滑走。'));C.push(R('R2-05','m','開頭換成提問、懸念或最吸睛的畫面；機關名稱留到片尾。'));score-=10;}
  else if(first)A.push(R('R2-05','l','第 1 鏡沒有放機關名稱或致詞，開頭 3 秒留給抓住對象的畫面。'));
  if(!endOk){A.push(R('R2-06','h','最後一鏡的旁白與字卡沒有行動呼籲，觀眾看完不知道要做什麼。'));C.push(R('R2-06','m',`片尾放上第 1 階段的行動呼籲「${cut(unquote(p1.cta),16)||'一個具體動作'}」。`));score-=10;}
  else A.push(R('R2-06','l','片尾有清楚的行動呼籲。'));
  if(dupCard.length){A.push(R('R2-07','m',`${nosTxt(dupCard.map(o=>o.no))}的字卡重複整句旁白，畫面變擠，觀眾也不會多記住。`));C.push(R('R2-07','m','字卡只留 10 字內的關鍵字；旁白已經說的，不要再打一次。'));score-=6;}
  else A.push(R('R2-07','l','字卡沒有重複整句旁白，只放關鍵字。'));

  else if(total<len-tol){A.push(R('R5-01','m',`粗剪總長 ${total} 秒，比目標 ${len} 秒短了 ${len-total} 秒，可能缺畫面。`));C.push(R('R5-01','m','回頭看缺的畫面，用 B-roll 或 AI 補畫面補上。'));score-=4;}
  else A.push(R('R5-01','l',`粗剪總長 ${total} 秒，沒有超過目標 ${len} 秒。`));

  else A.push(R('R5-02','l','素材已分成主畫面、B-roll、NG 三堆。'));
  if(!noneMiss&&!/補拍|AI\s*補|AI\s*生成/.test(String(d.missing||''))){A.push(R('R5-03','m','寫了缺的畫面，但沒寫補法。'));C.push(R('R5-03','m','每個缺的畫面註明「建議補拍或用 AI 補」。'));score-=4;}

  else if(ratioBad.length){A.push(R('R5-04','m',`${ratioBad.map(v=>`${v.plat} 選了 ${v.ratio}，平台常用 ${specOf(v).ratio}`).join('；')}。`));C.push(R('R5-04','m','依平台改比例：Shorts、Reels 用 9:16，Facebook 用 1:1，YouTube 用 16:9；可用 D2-P9 一次改三種。'));score-=6;}
  else A.push(R('R5-04','l',`${vs.length} 個版本的比例都對得上平台。`));

  if(lenFree.length)A.push(R('R5-05','i',`${lenFree.map(v=>v.plat).join('、')}沒有規定片長；${[...new Set(lenFree.map(v=>specOf(v).note))].join('、')}。`));
  if(zoneBad.length){A.push(R('R5-06','m',`${zoneBad.map(v=>`${v.plat} ${v.ratio} 的字卡放在「${v.cardPos}」`).join('；')}，會被平台的按鈕或說明文字擋住。`));C.push(R('R5-06','m',[...new Set(zoneBad.map(v=>SAFE_TIP[v.ratio]).filter(Boolean))].join('')||'字卡移到畫面中間偏上。'));score-=6;}
  else if(vs.length)A.push(R('R5-06','l','每個版本的字卡都避開平台的安全區。'));
  if(coverLong.length){A.push(R('R5-07','m',`封面標題超過 12 字：${coverLong.map(v=>`${v.plat}「${cut(v.cover,16)}」${charsOf(v.cover)} 字`).join('、')}。`));C.push(R('R5-07','m','封面標題 12 字內，只留對象最在意的那句話。'));score-=4;}
  else if(vs.length)A.push(R('R5-07','l','封面標題都在 12 字內。'));
  if(postN>80){A.push(R('R5-08','m',`貼文 ${postN} 字，超過 80 字。`));C.push(R('R5-08','m','貼文 80 字內：一句對象最在意的事、一個行動呼籲就夠了。'));score-=4;}

  H.push(R('R5-10','m',`${vs.map(v=>v.plat).join('、')||'各平台'}的版本在手機上播放時，字卡沒被擋住，靜音也看得懂。`,'匯出後傳到自己的手機，用各平台的預覽或私人帳號播放一次，再靜音看一次。'));
  const fix=(!!d1&&total>len)||hype.length>0;
  N.push(R('R5-N1',fix?'h':'m',d1&&total>len?`先把粗剪刪到 ${len} 秒內，再調字卡位置與封面標題。`:hype.length?'先改掉貼文與封面的誇大字眼，再匯出各平台版本。':'把沒打勾的成果檢核補完，匯出 MP4。'));

const cut=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n)+'…':s};

/* 泳道流程圖：steps=[{step,lane,work,wait,value|ecrs}]；colorBy(s) 回傳 'r'|'y'|'g'|''（預設藍） */
function swimlaneSVG(steps,colorBy){
  steps=steps.filter(s=>s.step);if(!steps.length)return'';
  const lanes=[...new Set(steps.map(s=>s.lane||'未指定'))];
  const colW=132,laneH=78,left=150,top=30;const W=left+steps.length*colW+20,Hh=top+lanes.length*laneH+10;
  let svg=`<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg" font-family="inherit" font-size="11">`;
  svg+=`<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8795a7"/></marker></defs>`;
  lanes.forEach((l,i)=>{const y=top+i*laneH;svg+=`<rect x="0" y="${y}" width="${W}" height="${laneH}" fill="${i%2?'#f8fafc':'#ffffff'}" stroke="#e3e9f2"/><text x="10" y="${y+laneH/2+4}" font-weight="700" fill="#0f2a4a">${esc(cut(l,11))}</text>`;});
  const color=s=>{const v=colorBy(s);return v==='r'?['#fde8e8','#dc2626']:v==='y'?['#fff4dd','#b7791f']:v==='g'?['#e7f7ec','#16a34a']:['#e8efff','#2563eb']};
  const pos=steps.map((s,i)=>{const li=lanes.indexOf(s.lane||'未指定');return{x:left+i*colW+8,y:top+li*laneH+12,w:colW-16,h:laneH-24}});
  pos.forEach((p,i)=>{if(i<pos.length-1){const n=pos[i+1];svg+=`<path d="M${p.x+p.w},${p.y+p.h/2} C${p.x+p.w+10},${p.y+p.h/2} ${n.x-10},${n.y+n.h/2} ${n.x},${n.y+n.h/2}" fill="none" stroke="#8795a7" stroke-width="1.5" marker-end="url(#arr)"/>`}});
  steps.forEach((s,i)=>{const p=pos[i],[bg,st]=color(s);svg+=`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" fill="${bg}" stroke="${st}" stroke-width="1.5"/><text x="${p.x+8}" y="${p.y+18}" font-weight="700" fill="#1b2a41">${i+1}. ${esc(cut(s.step,8))}</text><text x="${p.x+8}" y="${p.y+34}" fill="#5b6b7f" font-size="10">作業 ${num(s.work)}h｜等待 ${num(s.wait)}h</text><text x="${p.x+8}" y="${p.y+48}" fill="${st}" font-size="10">${esc(cut(s.value||s.ecrs||'',10))}</text>`;});
  return svg+'</svg>';
}

/* 魚骨圖：d 需含 problem 與六大類欄位；cats 可自訂 [[欄位id,標籤]]×6 */
const FISHBONE_CATS=[['fb_man','人'],['fb_machine','機／系統'],['fb_material','料／資料'],['fb_method','法／流程'],['fb_env','環'],['fb_measure','量測']];
function fishboneSVG(d,cats){
  cats=cats||FISHBONE_CATS;
  const W=900,Hh=330,spineY=165,headX=700;
  let s=`<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg" font-size="10.5" font-family="inherit">`;
  s+=`<line x1="40" y1="${spineY}" x2="${headX}" y2="${spineY}" stroke="#0f2a4a" stroke-width="3"/><polygon points="${headX},${spineY-8} ${headX+12},${spineY} ${headX},${spineY+8}" fill="#0f2a4a"/>`;
  s+=`<rect x="${headX+14}" y="${spineY-48}" width="176" height="96" rx="10" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>`;
  const prob=cut(d.problem||'問題',60);const lines=[];for(let i=0;i<prob.length;i+=13)lines.push(prob.slice(i,i+13));
  lines.slice(0,5).forEach((l,i)=>{s+=`<text x="${headX+22}" y="${spineY-30+i*16}" fill="#7f1d1d" font-weight="700">${esc(l)}</text>`});
  cats.forEach((c,i)=>{const top=i<3;const x=90+(i%3)*210;const yEnd=top?40:290;const txt=(d[c[0]]||'').trim();
    s+=`<line x1="${x+70}" y1="${spineY}" x2="${x}" y2="${yEnd}" stroke="#2563eb" stroke-width="2"/>`;
    s+=`<rect x="${x-34}" y="${top?yEnd-28:yEnd+4}" width="80" height="22" rx="6" fill="#0f2a4a"/><text x="${x+6}" y="${top?yEnd-13:yEnd+19}" fill="#fff" font-weight="700" text-anchor="middle">${esc(c[1])}</text>`;
    if(txt){const t=cut(txt,44);const ls=[];for(let k=0;k<t.length;k+=16)ls.push(t.slice(k,k+16));ls.slice(0,3).forEach((l,k)=>{s+=`<text x="${x+10}" y="${top?yEnd+22+k*13:yEnd-40+k*13}" fill="#1b2a41">${esc(l)}</text>`});}
    else s+=`<text x="${x+10}" y="${top?yEnd+22:yEnd-28}" fill="#a3aebb">（未填）</text>`;});
  return s+'</svg>';
}

/* ---------------- 透明規則引擎（非 LLM） ---------------- */
const Engine={
  name:'透明規則引擎 v1.0（Rule-based，非 LLM）',version:'1.0.0',adapter:null,
  registerAIAdapter(a){if(!a||typeof a.analyze!=='function')throw new Error('adapter 需提供 analyze(payload) 函式');this.adapter=a;},
  async diagnose(stageId,data,S){
    const t0=performance.now();const base=RULES[stageId](data,S);
    base.engine=this.name;base.generatedAt=new Date().toISOString();base.rulesFired=[...new Set([...base.assessment,...base.hypotheses,...base.recommendations,...base.nextActions].map(x=>x.rule))];
    base.ms=Math.round(performance.now()-t0);
    if(this.adapter){try{const extra=await this.adapter.analyze({stageId,data,context:S.all(),ruleResult:JSON.parse(JSON.stringify(base))});base.aiExtra={name:this.adapter.name||'External AI Adapter',text:String(extra&&extra.text||extra||'')};}catch(e){base.aiExtra={name:this.adapter.name||'External AI Adapter',error:String(e.message||e)};}}
    return base;
  }
};

const staleBy=id=>{const r=rec(id);if(!r.confirmed)return[];return STAGES.filter(s=>s.id<+id&&rec(s.id).confirmedAt>r.confirmedAt).map(s=>s.id);};

/* ---------------- 階段頁 ---------------- */
function renderStage(id,tab){const st=stage(id);if(!st)return renderHome();const r=rec(id);
  if(!unlocked(id)){const m=STAGES.find(s=>s.id<id&&!rec(s.id).confirmed);document.getElementById('view').innerHTML=`<div class="card lock-screen"><div class="ic">🔒</div><h2>第 ${id} 階段尚未解鎖</h2><p class="muted">請先完成第 ${m.id} 階段「${m.title}」並按「確認診斷」。</p><button class="btn primary" onclick="go('stage-${m.id}')">前往第 ${m.id} 階段</button></div>`;return;}
  tab=tab||(r.confirmed?'dx':r.draft?'input':'method');
  const st_=statusOf(id);const stale=staleBy(id);
  const extras=EXTRA_TABS.filter(x=>x.stage===id);
  const tabs=[['method','方法說明'],['guide','操作指引'],['demo','參考範例'],['input','填寫資料'],['dx','診斷結果'],...extras.map(x=>[x.key,x.label])];
  document.getElementById('view').innerHTML=`
  <div class="stage-hero"><div class="big">${id}</div><div style="flex:1"><div class="flex sb"><div><h1>${st.title}</h1><div class="en">STAGE ${id} ｜ ${st.en}</div></div><span class="badge ${st_==='done'?'g':'in'}">${st_==='done'?'已確認 '+new Date(r.confirmedAt).toLocaleString('zh-TW'):st_==='draft'?'草稿中':'可開始'}</span></div><div class="goal"><b>階段目標：</b>${st.goal}</div>
  ${stale.length?`<div class="note warn mt8"><b>前階段資料已更新：</b>第 ${stale.join('、')} 階段在本階段確認後重新確認過，本階段的帶入資料與診斷可能過期。建議按「返回修改」並重新確認診斷。</div>`:''}</div></div>
  <div class="tabs">${tabs.map(t=>`<div class="tab ${tab===t[0]?'active':''} ${(t[0]==='dx'&&r.dx)||(t[0]==='input'&&r.draft)?'has':''}" onclick="renderStage(${id},'${t[0]}')"><span class="dot"></span>${t[1]}</div>`).join('')}</div>
  <div class="tabpanel ${tab==='method'?'active':''}">${methodHTML(st)}</div>
  <div class="tabpanel ${tab==='guide'?'active':''}">${guideHTML(st)}</div>
  <div class="tabpanel ${tab==='demo'?'active':''}">${demoHTML(st)}</div>
  <div class="tabpanel ${tab==='input'?'active':''}" id="inputPanel">${inputHTML(st)}</div>
  <div class="tabpanel ${tab==='dx'?'active':''}">${r.dx?dxHTML(st,r.dx,r):`<div class="card lock-screen"><div class="ic">🧭</div><h3>尚未產生診斷</h3><p class="muted">請於「填寫資料」完成必填欄位並按「確認診斷」。</p><button class="btn primary" onclick="renderStage(${id},'input')">前往填寫資料</button></div>`}</div>
  ${extras.map(x=>`<div class="tabpanel ${tab===x.key?'active':''}">${x.html()}</div>`).join('')}`;
  if(tab==='input')bindForm(st);const ex=extras.find(x=>x.key===tab);if(ex&&ex.run)ex.run();
  window.scrollTo({top:0});
  fxEnter('stage-'+id+'-'+tab,_fxKey.indexOf('stage-'+id+'-')===0?'#view .tabpanel.active > *':null);setTimeout(fxAnnotate,420);}

function methodHTML(st){const m=st.method;return`<div class="card"><div class="card-h"><h2>方法說明</h2><span class="pill">${st.en}</span></div><p>${m.intro}</p><div class="grid g2 mt12">${m.points.map(p=>`<div class="kpi" style="border-left:4px solid var(--teal)"><b style="color:var(--navy)">${p[0]}</b><div class="small muted mt8" style="line-height:1.6">${p[1]}</div></div>`).join('')}</div><h4 class="mt16">使用工具</h4><div class="flex">${m.tools.map(t=>`<span class="pill" title="${t[1]}"><b>${t[0]}</b>｜${t[1]}</span>`).join('')}</div><div class="note mt12"><b>本階段交付物：</b>${m.deliverable}</div><div class="btn-row mt12"><button class="btn primary" onclick="renderStage(${st.id},'guide')">下一步：操作指引 →</button></div></div>`;}
function guideHTML(st){return`<div class="card"><div class="card-h"><h2>操作指引</h2></div><ol class="steps">${st.guide.map(g=>`<li>${g}</li>`).join('')}</ol><div class="legend mt16"><div class="it"><span class="badge ex">範例</span>參考範例資料</div><div class="it"><span class="badge in">你的資料</span>你填寫的資料</div><div class="it"><span class="badge dx">診斷推論</span>規則引擎輸出</div><div class="it"><span class="badge hy">待驗證假設</span>需驗證</div></div><div class="btn-row mt12"><button class="btn primary" onclick="renderStage(${st.id},'demo')">下一步：參考範例 →</button></div></div>`;}
function demoHTML(st){return`<div class="card"><div class="card-h"><h2>參考範例</h2><span class="badge ex">範例</span></div><div class="note gray">${st.demo}</div>${renderData(st,st.example,'ex')}<div class="footer-actions">${APP.exampleFill?`<button class="btn teal" onclick="loadExample(${st.id})">載入範例至表單</button>`:''}<button class="btn primary" onclick="renderStage(${st.id},'input')">前往填寫資料 →</button></div></div>`;}

/* 唯讀資料渲染（參考範例／報告共用） */
const isEmptyVal=v=>v==null||v===''||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);
function renderData(st,d,badge){d=d||{};return st.sections.map(sec=>{const fs=sec.fields.filter(f=>visibleOf(f,d)&&!isEmptyVal(d[f.id]));if(!fs.length)return'';
  return`<div class="form-section"><h3><span class="badge ${badge}">${badge==='ex'?'範例':'你的資料'}</span>${sec.title}</h3>${fs.map(f=>{const v=d[f.id];let body='';
    if(f.type==='table')body=roTable(f,v);else if(f.type==='checks')body=`<div class="flex">${(v||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`;
    else if(f.type==='likert')body=barRows(f.items.map(it=>({label:it[1],value:num(v[it[0]]),text:num(v[it[0]])+'/5'})),5);
    else body=`<div style="white-space:pre-wrap">${esc(v)}</div>`;
    return`<div class="field"><label class="lbl">${esc(f.label)}</label>${body}</div>`;}).join('')}</div>`;}).join('');}
function roTable(f,rows){rows=(rows||[]).filter(r=>Object.values(r).some(x=>String(x??'').trim()));if(!rows.length)return'<span class="muted small">－</span>';
  return`<div class="tbl-wrap"><table class="tbl compact"><thead><tr>${f.cols.map(c=>`<th>${c.l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${f.cols.map(c=>{const v=c.t==='calc'?c.calc(r):esc(r[c.k]);return`<td style="${c.t==='calc'?'font-weight:700;text-align:center;white-space:nowrap':String(v??'').length<=10?'white-space:nowrap':''}">${v}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;}

/* ---------------- 表單 ---------------- */
function inputHTML(st){const r=rec(st.id);const d=r.draft||{};CURRENT_CARRY=st.carry(S)||[];const nxt=stage(st.id+1);
  const carry=CURRENT_CARRY.length?`<div class="carry"><h4>🔗 前階段帶入（已確認資料）</h4>${CURRENT_CARRY.map((b,bi)=>`<div class="mb8"><b class="small">${esc(b.title)}</b>${b.note?`<div class="tiny muted">${esc(b.note)}</div>`:''}<div class="chips mt8">${(b.chips||[]).map((c,ci)=>`<span class="chip" onclick="applyChip(${st.id},${bi},${ci})" title="點選帶入">＋ ${esc(c.label)}</span>`).join('')}${(b.static||[]).map(s=>`<span class="chip static">${esc(s)}</span>`).join('')}</div>${(b.chips||[]).length>1&&!b.chips.every(c=>c.replace&&c.field===b.chips[0].field)?`<button class="btn sm mt8" onclick="applyAll(${st.id},${bi})">全部帶入</button>`:''}</div>`).join('')}</div>`:'';
  const banner=r.confirmed?`<div class="note ok"><b>本階段已確認。</b>表單為唯讀；如需修改請按「返回修改」，修改後需重新確認診斷，後續階段將暫時鎖定（資料保留）。 <button class="btn sm" onclick="reopen(${st.id})">返回修改</button></div>`:'';
  const form=st.sections.map((sec,i)=>`<div class="form-section"><h3><span class="n">${i+1}</span>${sec.title}${sec.desc?`<span class="tiny muted">${sec.desc}</span>`:''}</h3>${sec.fields.map(f=>fieldHTML(st,f,d)).join('')}</div>`).join('');
  return`<div class="card">${banner}${carry}<form id="stageForm" onsubmit="return false" ${r.confirmed?'class="ro"':''}>${form}</form><div id="formErrors"></div>
  <div class="footer-actions">${r.confirmed?`<button class="btn" onclick="renderStage(${st.id},'dx')">查看診斷結果</button>${nxt?`<button class="btn primary" onclick="go('stage-${nxt.id}')">前往第 ${nxt.id} 階段 →</button>`:`<button class="btn primary" onclick="go('report')">前往${esc(UI.reportName)} →</button>`}`:
  `${APP.exampleFill?`<button class="btn teal" onclick="loadExample(${st.id})">載入範例</button>`:''}<button class="btn" onclick="saveDraft(${st.id},true)">儲存草稿</button><button class="btn danger ghost" onclick="clearStage(${st.id})">清除本階段</button><span style="flex:1"></span><button class="btn primary lg" onclick="confirmStage(${st.id})">確認診斷 ✓</button>`}</div></div>`;}

/* 範例以灰字提示呈現在欄位下方（APP.exampleFill 另外控制「載入範例」按鈕）；表格取前 2 列摘要 */
function exHint(f,v){if(isEmptyVal(v)||f.type==='likert')return'';let t;
  if(f.type==='checks')t=(v||[]).join('、');
  else if(f.type==='table'){const rows=(v||[]).filter(r=>Object.values(r).some(x=>String(x??'').trim()));if(!rows.length)return'';
    t=rows.slice(0,2).map(r=>f.cols.filter(c=>c.t!=='calc'&&String(r[c.k]??'').trim()).map(c=>`${c.l}：${cut(String(r[c.k]),18)}`).join('｜')).join('；')+(rows.length>2?`（範例共 ${rows.length} 列）`:'');}
  else t=String(v);
  return`<div class="ex"><b>範例：</b>${esc(t)}</div>`;}
function fieldHTML(st,f,d){const v=d[f.id];const req=requiredOf(f)?'<span class="req">*</span>':'';
  const exHtml=exHint(f,st.example[f.id]);
  const help=f.help?`<div class="help">${f.help}</div>`:'';let c='';
  switch(f.type){
    case'text':c=`<input type="text" data-f="${f.id}" value="${esc(v??'')}" placeholder="${esc(f.ph||'')}">`;break;
    case'number':c=`<input type="number" step="any" data-f="${f.id}" value="${esc(v??'')}" placeholder="${esc(f.ph||'')}">`;break;
    case'textarea':c=`<textarea data-f="${f.id}" placeholder="${esc(f.ph||'')}">${esc(v??'')}</textarea>`;break;
    case'select':c=`<select data-f="${f.id}"><option value="">請選擇</option>${f.options.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;break;
    case'checks':c=`<div class="chk-group">${f.options.map(o=>`<label class="chk ${(v||[]).includes(o)?'on':''}"><input type="checkbox" data-f="${f.id}" value="${esc(o)}" ${(v||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;break;
    case'likert':c=f.items.map(it=>`<div class="flex mb8" style="gap:12px"><span style="width:110px;font-size:13px;font-weight:600">${it[1]}</span><div class="likert" style="flex:1">${[1,2,3,4,5].map(n=>`<label class="${v&&+v[it[0]]===n?'on':''}"><input type="radio" name="lk_${f.id}_${it[0]}" value="${n}" ${v&&+v[it[0]]===n?'checked':''}>${n}</label>`).join('')}</div></div>`).join('');break;
    case'table':c=tableHTML(f,v||[]);break;}
  const hidden=visibleOf(f,d)?'':'style="display:none"';
  return`<div class="field" id="fld_${f.id}" ${f.dep?`data-dep="${f.dep}" data-depval="${esc(f.depVal||'是')}"`:''} ${hidden}><label class="lbl">${esc(f.label)}${req}</label>${help}${c}${exHtml}<div class="err-msg" id="err_${f.id}"></div></div>`;}
function tableHTML(f,rows){if(!rows.length)rows=[{}];return`<div class="tbl-wrap"><table class="tbl tbl-edit" data-tbl="${f.id}"><thead><tr>${f.cols.map(c=>`<th style="width:${c.w||'auto'}">${c.l}</th>`).join('')}<th style="width:34px"></th></tr></thead><tbody>${rows.map((r,i)=>rowHTML(f,r,i)).join('')}</tbody></table></div><div class="btn-row mt8 no-print"><button class="btn sm" onclick="addRow('${f.id}')">＋ 新增一列</button><span class="tiny muted">至少 ${f.min||1} 列有效資料</span></div>`;}
function rowHTML(f,r,i){return`<tr data-row="${i}">${f.cols.map(c=>{const v=r[c.k]??'';
  if(c.t==='calc')return`<td class="calc" data-calc="${c.k}">${c.calc(r)}</td>`;
  if(c.t==='select')return`<td><select data-k="${c.k}"><option value="">－</option>${c.o.map(o=>`<option ${String(v)===o?'selected':''}>${o}</option>`).join('')}</select></td>`;
  if(c.t==='number')return`<td><input type="number" step="any" data-k="${c.k}" value="${esc(v)}"></td>`;
  if(c.t==='textarea')return`<td><textarea data-k="${c.k}" rows="2">${esc(v)}</textarea></td>`;
  return`<td><input type="text" data-k="${c.k}" value="${esc(v)}"></td>`;}).join('')}<td><button type="button" class="rm" title="刪除此列" onclick="rmRow('${f.id}',${i})">✕</button></td></tr>`;}

function collect(st){const d={};st.sections.forEach(sec=>sec.fields.forEach(f=>{const el=document.getElementById('fld_'+f.id);if(!el)return;
  if(f.type==='table'){const rows=[];el.querySelectorAll('tbody tr').forEach(tr=>{const r={};tr.querySelectorAll('[data-k]').forEach(inp=>r[inp.dataset.k]=inp.value);rows.push(r);});d[f.id]=rows;}
  else if(f.type==='checks')d[f.id]=[...el.querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value);
  else if(f.type==='likert'){const o={};f.items.forEach(it=>{const c=el.querySelector(`input[name="lk_${f.id}_${it[0]}"]:checked`);if(c)o[it[0]]=+c.value;});d[f.id]=o;}
  else{const inp=el.querySelector('[data-f]');d[f.id]=inp?inp.value:'';}}));return d;}
function bindForm(st){const form=document.getElementById('stageForm');if(!form)return;const r=rec(st.id);
  if(r.confirmed){form.querySelectorAll('input,select,textarea,button').forEach(e=>e.disabled=true);return;}
  const h=e=>{const t=e.target;
    if(t.closest('.chk'))t.closest('.chk').classList.toggle('on',t.checked);
    if(t.type==='radio'&&t.closest('.likert'))t.closest('.likert').querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
    const tr=t.closest('tr');if(tr){const tbl=t.closest('table');const f=findField(st,tbl.dataset.tbl);const row={};tr.querySelectorAll('[data-k]').forEach(i=>row[i.dataset.k]=i.value);tr.querySelectorAll('[data-calc]').forEach(td=>{const c=f.cols.find(x=>x.k===td.dataset.calc);td.textContent=c.calc(row);});}
    if(t.dataset.f){document.querySelectorAll(`[data-dep="${t.dataset.f}"]`).forEach(el=>el.style.display=t.value===el.dataset.depval?'':'none');}
    const fld=t.closest('.field');if(fld)fld.classList.remove('invalid');
    clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveDraft(st.id,false),500);};
  form.addEventListener('input',h);form.addEventListener('change',h);}
function findField(st,id){for(const s of st.sections)for(const f of s.fields)if(f.id===id)return f;return null;}
function saveDraft(id,notify){const st=stage(id);const form=document.getElementById('stageForm');if(!form)return;const d=collect(st);STATE.stages[id]={...rec(id),draft:d};save();if(notify){toast('草稿已儲存');renderSidebar();}}
function refreshField(st,fid,d){const f=findField(st,fid);const el=document.getElementById('fld_'+fid);if(!el)return;const tmp=document.createElement('div');tmp.innerHTML=fieldHTML(st,f,d);el.replaceWith(tmp.firstElementChild);}
function addRow(fid){const st=stage(STATE.view.split('-')[1]);const d=collect(st);(d[fid]=d[fid]||[]).push({});refreshField(st,fid,d);saveDraft(st.id,false);}
function rmRow(fid,i){const st=stage(STATE.view.split('-')[1]);const d=collect(st);d[fid].splice(i,1);refreshField(st,fid,d);saveDraft(st.id,false);}
function loadExample(id){const st=stage(id);if(rec(id).confirmed){toast('本階段已確認，請先「返回修改」',true);return;}
  const d=JSON.parse(JSON.stringify(st.example));STATE.stages[id]={...rec(id),draft:d};save();renderStage(id,'input');toast('已載入範例資料（標示為範例，請依需求修改）');}
function clearStage(id){modal(`<h3>清除第 ${id} 階段資料？</h3><p class="muted">將刪除本階段草稿與診斷結果；後續階段資料保留但將鎖定。</p><div class="btn-row"><button class="btn danger" onclick="doClear(${id})">確認清除</button><button class="btn" onclick="closeModal()">取消</button></div>`);}
function doClear(id){delete STATE.stages[id];save();closeModal();renderStage(id,'input');renderSidebar();renderProgress();toast('已清除');}
function reopen(id){STATE.stages[id]={...rec(id),confirmed:false};save();renderSidebar();renderProgress();renderStage(id,'input');toast('已開放修改；完成後請重新確認診斷');}
/* 帶入規則：表格欄位 → 新增一列（深拷貝）；文字欄位 → 空白或 replace 時取代，否則換行附加 */
function mergeChip(st,d,c){const f=findField(st,c.field);
  if(f.type==='table'){const rows=(d[c.field]||[]).filter(r=>Object.values(r).some(x=>String(x??'').trim()));
    const same=r=>Object.keys(c.value).every(k=>String(r[k]??'').trim()===String(c.value[k]??'').trim()); // skip rows already carried in
    if(!rows.some(same))rows.push(JSON.parse(JSON.stringify(c.value)));d[c.field]=rows;}
  else{const cur=String(d[c.field]||'').trim();d[c.field]=c.replace||!cur?c.value:cur.includes(String(c.value).trim())?cur:cur+'\n'+c.value;}}
function applyChip(id,bi,ci){const st=stage(id);if(rec(id).confirmed)return toast('本階段已確認，請先「返回修改」',true);const c=CURRENT_CARRY[bi].chips[ci];const d=collect(st);
  mergeChip(st,d,c);refreshField(st,c.field,d);saveDraft(id,false);toast('已帶入');}
function applyAll(id,bi){const st=stage(id);if(rec(id).confirmed)return toast('本階段已確認，請先「返回修改」',true);const b=CURRENT_CARRY[bi];const d=collect(st);
  const seen=new Set(),use=b.chips.filter(c=>!c.replace||(!seen.has(c.field)&&seen.add(c.field))); // first replace chip per field wins
  use.forEach(c=>mergeChip(st,d,c));[...new Set(use.map(c=>c.field))].forEach(fid=>refreshField(st,fid,d));saveDraft(id,false);toast(`已帶入 ${use.length} 筆`);}

/* ---------------- 驗證 ---------------- */
function validate(st,d){const errs=[];st.sections.forEach(sec=>sec.fields.forEach(f=>{if(!visibleOf(f,d))return;const req=requiredOf(f);const v=d[f.id];let msg='';
  if(f.type==='table'){const rows=(v||[]).filter(r=>String(r[f.cols[0].k]??'').trim());if(req&&rows.length<(f.min||1))msg=`至少需填寫 ${f.min||1} 列有效資料（目前 ${rows.length} 列；第一欄為必填）`;
    else{const bad=[];rows.forEach((r,i)=>f.cols.forEach(c=>{if((c.t==='select'||c.t==='number')&&String(r[c.k]??'').trim()==='')bad.push(`第 ${i+1} 列「${c.l}」`);}));if(bad.length)msg='請完成：'+bad.slice(0,4).join('、')+(bad.length>4?` 等 ${bad.length} 處`:'');}}
  else if(f.type==='checks'){if(req&&(v||[]).length<(f.min||1))msg=`至少選擇 ${f.min||1} 項`;}
  else if(f.type==='likert'){const miss=f.items.filter(it=>!(v&&v[it[0]]));if(req&&miss.length)msg='請完成評分：'+miss.map(m=>m[1]).join('、');}
  else if(req&&String(v??'').trim()==='')msg='此欄位為必填';
  if(msg)errs.push({id:f.id,msg});}));
  if(st.validate)errs.push(...st.validate(d).map(m=>({id:null,msg:m})));return errs;}

async function confirmStage(id){const st=stage(id);const d=collect(st);const errs=validate(st,d);
  document.querySelectorAll('.field.invalid').forEach(e=>e.classList.remove('invalid'));
  document.querySelectorAll('.err-msg').forEach(e=>e.textContent='');
  errs.forEach(e=>{if(e.id){const el=document.getElementById('fld_'+e.id);el.classList.add('invalid');document.getElementById('err_'+e.id).textContent=e.msg;}});
  const box=document.getElementById('formErrors');
  if(errs.length){box.innerHTML=`<div class="note err"><b>尚有 ${errs.length} 處待修正：</b><ul class="clean small">${errs.map(e=>`<li>${e.id?esc(findField(st,e.id).label)+'：':''}${esc(e.msg)}</li>`).join('')}</ul></div>`;const first=errs.find(e=>e.id);if(first)document.getElementById('fld_'+first.id).scrollIntoView({behavior:'smooth',block:'center'});toast(`尚有 ${errs.length} 處待修正`,true);return;}
  box.innerHTML='';
  st.sections.forEach(sec=>sec.fields.forEach(f=>{if(f.type==='table')d[f.id]=(d[f.id]||[]).filter(r=>String(r[f.cols[0].k]??'').trim());if(f.type==='number'&&d[f.id]!=='')d[f.id]=+d[f.id];}));
  const dx=await Engine.diagnose(id,d,S);
  STATE.stages[id]={draft:d,data:d,dx,confirmed:true,confirmedAt:new Date().toISOString()};save();renderSidebar();renderProgress();renderStage(id,'dx');fxConfetti(id===N_STAGES||doneCount()===N_STAGES);
  const nxt=stage(id+1);toast(nxt?(unlocked(nxt.id)?`第 ${id} 階段診斷完成，第 ${nxt.id} 階段已解鎖`:`第 ${id} 階段診斷完成`):`${APP.flowName}全部完成！可前往${UI.reportName}`);}

/* ---------------- 診斷結果 ---------------- */

  const item=x=>`<div class="dx-item"><span class="sev ${x.sev||'i'}"></span><div style="flex:1">${esc(x.text)}${x.verify?`<div class="tiny muted mt8">驗證方式：${esc(x.verify)}</div>`:''}</div><span class="rule" title="規則編號（可追溯）">${x.rule}</span></div>`;

  <div class="grid g4" style="gap:10px">${dx.metrics.map(m=>`<div class="kpi ${m.cls||''}"><div class="v" style="font-size:20px">${esc(m.value)}</div><div class="l">${esc(m.label)}</div></div>`).join('')}</div></div>
  <div class="grid g2 mt16"><div class="dx-block"><h3><span class="badge dx">診斷推論</span>問題評估</h3>${dx.assessment.map(item).join('')||'<span class="muted small">無</span>'}</div>
  <div class="dx-block" style="border-color:#f3d9a4;background:#fffcf5"><h3><span class="badge hy">待驗證假設</span>根因假設</h3>${dx.hypotheses.map(item).join('')||'<span class="muted small">本階段未產生需驗證之假設。</span>'}</div>
  <div class="dx-block"><h3><span class="badge dx">診斷推論</span>改善建議</h3>${dx.recommendations.map(item).join('')||'<span class="muted small">無額外建議，請依方法說明持續精進。</span>'}</div>

/* ---------------- 報告頁（由 REPORT 設定驅動） ---------------- */
const DX_KEY_LABEL={assessment:'問題評估',hypotheses:'根因假設（待驗證）',recommendations:'改善建議',nextActions:'下一步行動'};
function renderReport(){const n=doneCount();const all=n===N_STAGES;
  const dx=id=>isDone(id)?rec(id).dx:null;const d=id=>(isDone(id)&&rec(id).data)||{};
  const scores=STAGES.filter(s=>dx(s.id)).map(s=>dx(s.id).score);
  const ctx={n,all,d,dx,avgScore:scores.length?Math.round(avg(scores)):0};
  const sec=(t,body)=>`<div class="report-section"><h2>${t}</h2>${body}</div>`;
  const miss=STAGES.filter(s=>!isDone(s.id));
  const head=`<div class="no-print card tight flex sb"><div><b>${all?`${APP.flowName}已全部完成，報告已自動彙整。`:`已完成 ${n}/${N_STAGES} 階段，以下為部分彙整（完成後自動更新）。`}</b>${all?'':`<div class="tiny muted">尚未完成：${miss.map(s=>`第 ${s.id} 階段 ${s.title}`).join('、')}</div>`}</div><div class="btn-row"><button class="btn primary" onclick="savePDF()">⬇ 下載 PDF</button><button class="btn teal" onclick="sendPlan()">✉ 寄給${esc(MAIL.toLabel)}</button>${all?'':`<button class="btn" onclick="go('stage-${miss[0].id}')">繼續第 ${miss[0].id} 階段</button>`}</div></div>`;
  const caseLines=REPORT.caseLines?REPORT.caseLines(ctx):[`案主：${CASE.name}｜${CASE.title}`]; // client-type: replaces CASE.system + case line
  const coverLines=(REPORT.coverLines?REPORT.coverLines(ctx):[]).concat(caseLines,[`報告日期：${new Date().toLocaleDateString('zh-TW')}　·　完成階段：${n}/${N_STAGES}　·　診斷引擎：${Engine.name}`]);
  const cover=`<div class="report-cover"><div class="tiny" style="opacity:.8;letter-spacing:2px">${esc(REPORT.eyebrow)}</div><h1>${esc(REPORT.title)}</h1><div class="sub">${esc(REPORT.subtitle(ctx))}</div>${REPORT.caseLines?'':`<div class="sub mt8">${CASE.system}</div>`}${coverLines.map(l=>`<div class="sub">${esc(l)}</div>`).join('')}</div>`;
  const dxList=(id,keys)=>{const x=dx(id);if(!x)return'';return keys.map(k=>x[k].length?`<h4 class="mt8">${DX_KEY_LABEL[k]}</h4><ul class="clean small">${x[k].map(i=>`<li>${esc(i.text)} <span class="rule tiny muted">[${i.rule}]</span>${i.verify?`<div class="tiny muted">驗證：${esc(i.verify)}</div>`:''}</li>`).join('')}</ul>`:'').join('');};
  const stHead=id=>{const x=dx(id);return x?`<div class="flex sb mb8"><span class="badge dx">${x.scoreLabel}：${x.score}／100</span><span class="tiny muted">${(x.rulesFired||[]).length} 條規則</span></div>`:'';};
  const summary=sec('一、執行摘要（Executive Summary）',REPORT.summary(ctx)+`<div class="legend mt12"><div class="it"><span class="badge in">你的資料</span>你確認的資料</div><div class="it"><span class="badge dx">診斷推論</span>規則引擎</div><div class="it"><span class="badge hy">待驗證假設</span>需驗證</div></div>`);
  const body=REPORT.sections.map((g,gi)=>sec(g.title,g.stages.map((id,k)=>{const st=stage(id);const x=dx(id);
    return`<h3 class="${k?'mt16':''}">${g.stages.length>1?`${gi+2}.${k+1} `:''}${esc(st.title)} <span class="badge in">你的資料</span></h3>${stHead(id)}${x?renderData(st,d(id),'in')+(x.visual||'')+dxList(id,g.keys||['assessment','hypotheses','recommendations']):'<span class="muted small">（未完成）</span>'}`;}).join('')));
  const actions=sec('優先行動清單（各階段彙整）',`<ol class="steps">${STAGES.filter(s=>dx(s.id)).flatMap(s=>dx(s.id).nextActions.map(a=>`<li><b>第 ${s.id} 階段</b>｜${esc(a.text)} <span class="tiny muted">[${a.rule}]</span></li>`)).join('')||'<li class="muted">（尚無）</li>'}</ol>`);
  const appendix=sec('附錄：待驗證假設總表與規則追溯',`<p class="small muted">以下假設由規則引擎依你填寫的資料推導，證據不足，需再查證、請教專業人士或實際試行後確認；每條附規則編號以供追溯。</p><div class="tbl-wrap"><table class="tbl compact"><tr><th>階段</th><th>假設</th><th>驗證方式</th><th>規則</th></tr>${STAGES.filter(s=>dx(s.id)).flatMap(s=>dx(s.id).hypotheses.map(h=>`<tr><td>${s.id}</td><td><span class="badge hy">待驗證</span> ${esc(h.text)}</td><td>${esc(h.verify||'')}</td><td class="mono tiny">${h.rule}</td></tr>`)).join('')||'<tr><td colspan="4" class="muted">（尚無）</td></tr>'}</table></div><p class="tiny muted mt12">本報告由 ${Engine.name} 產生，未使用大型語言模型；所有「診斷推論」皆可追溯至規則編號與你填寫的資料。報告產生時間：${new Date().toLocaleString('zh-TW')}</p>`);
  document.getElementById('view').innerHTML=head+'<div id="reportDoc">'+cover+summary+body.map(b=>'<div class="page-break"></div>'+b).join('')+'<div class="page-break"></div>'+actions+appendix+'</div>'+`<div class="no-print btn-row mt16"><button class="btn primary" onclick="savePDF()">⬇ 下載 PDF</button><button class="btn teal" onclick="sendPlan()">✉ 寄給${esc(MAIL.toLabel)}</button><button class="btn" onclick="go('home')">回首頁</button></div>`;
  fxEnter('report');}

/* ---------------- 重置 / 匯出匯入 ---------------- */
function confirmReset(){modal(`<h3>重置全部進度？</h3><p class="muted">將清除${esc(APP.flowName)}所有輸入與診斷（localStorage）。此動作無法復原，建議先「匯出進度」備份。</p><div class="btn-row"><button class="btn danger" onclick="doReset()">確認重置</button><button class="btn" onclick="exportJSON()">先匯出備份</button><button class="btn" onclick="closeModal()">取消</button></div>`);}
function doReset(){STATE={stages:{},view:'home',updatedAt:null};try{localStorage.removeItem(APP.storageKey);}catch(e){console.warn('localStorage 清除失敗',e);}closeModal();go('home');renderSidebar();renderProgress();toast('已重置');}
function exportJSON(){const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${APP.exportPrefix}_${new Date().toLocaleDateString('sv-SE')}.json`; /* sv-SE = local YYYY-MM-DD */a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function importJSON(){const i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.stages!=='object')throw new Error('格式不符');STATE=o;save();route();toast('進度已匯入');}catch(e){toast('匯入失敗：'+e.message,true);}};r.readAsText(f);};i.click();}
